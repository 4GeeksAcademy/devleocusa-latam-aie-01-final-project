# Production overlay. Supply TLS_CERT_FILE, TLS_KEY_FILE, TRACKFLOW_SECRET_FILE,
# KEYCLOAK_ADMIN_PASSWORD, and the public HTTPS URLs from the deployment secret store.
services:
  api:
    command: uvicorn src.fastapi_server:app --host 0.0.0.0 --port 8000
    ports: !reset []
    env_file: !reset []
    environment:
      TRACKFLOW_ENV: production
      SECRET_KEY_FILE: /run/secrets/api_secret
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set HTTPS frontend origins}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?Set public HTTPS MCP URL}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:?Set public HTTPS OIDC issuer URL}
      REDIS_URL: ${REDIS_URL:?Set production Redis URL}
      SQL_URL_FILE: /run/secrets/database_url
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:?Inject MCP OAuth client secret from secret store}
    secrets:
      - api_secret
      - database_url
    volumes: !reset []

  mcp:
    env_file: !reset []
    environment:
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?Set public HTTPS MCP URL}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:?Set public HTTPS OIDC issuer URL}
      OAUTH_JWKS_URI: ${OAUTH_JWKS_URI:?Set HTTPS OIDC JWKS URL}
    volumes: !reset []

  keycloak:
    command: start --http-enabled=true --proxy-headers=xforwarded --hostname-strict=true
    env_file: !reset []
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set Keycloak administrator username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Inject Keycloak password from secret store}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set public HTTPS Keycloak URL}
      KC_HOSTNAME_STRICT: "true"

  uis:
    ports: !reset []
    env_file: !reset []

  redis:
    profiles: [development]
    ports: !reset []
    image: redis:7.4.2-alpine

  celery-worker:
    volumes: !reset []
    env_file: !reset []
    depends_on: !reset []
    environment:
      REDIS_URL: ${REDIS_URL:?Set production Redis TLS URL}
      CELERY_BROKER_URL: ${REDIS_URL:?Set production Redis TLS URL}
      CELERY_RESULT_BACKEND: ${REDIS_URL:?Set production Redis TLS URL}

  flower:
    ports: !reset []
    profiles: [development]

  qdrant:
    ports: !reset []

  tls-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx/trackflow.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Provide TLS certificate from secret/certificate manager}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE:?Provide TLS private key from secret/certificate manager}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      - api
      - mcp
      - keycloak
    networks:
      - trackflow-net

secrets:
  api_secret:
    file: ${TRACKFLOW_SECRET_FILE:?Provide API signing secret file from secret manager}
  database_url:
    file: ${SQL_URL_FILE:?Provide database connection URL file from secret manager}