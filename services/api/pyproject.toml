[project]
name = "trackflow-api"
version = "0.1.0"
description = "TrackFlow backend API"
requires-python = ">=3.11"
dependencies = [
  "bcrypt<4.1",
  "celery[redis]>=5.4.0",
  "fastapi>=0.141.1",
  "flower>=2.0.0",
  "flask==3.0.3",
  "httpx>=0.27.0",
  "passlib[bcrypt]>=1.7.4",
  "prefect>=3.8.4",
  "psycopg2-binary>=2.9.0",
  "pydantic>=2.13.0",
  "pydantic-settings>=2.15.0",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.32",
  "redis>=5.0.0",
  "sendgrid>=6.12.5",
  "sqlmodel>=0.0.22,<0.0.34",
  "supabase>=2.0.0",
  "tinydb==4.8.0",
  "uvicorn>=0.52.0",
  "weasyprint>=60.0",
  "langgraph>=1.2.12",
  "langgraph-checkpoint-postgres>=3.1.2",
  "langsmith>=0.14.2",
  "psycopg[binary,pool]>=3.3.6",
  "openai>=1.0.0",
  "qdrant-client>=1.19.1",
  "python-dotenv>=1.2.3",
  "pandas>=2.1.0",
]

[project.scripts]
seed = "src.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:.*crypt.*deprecated.*:DeprecationWarning",
]
