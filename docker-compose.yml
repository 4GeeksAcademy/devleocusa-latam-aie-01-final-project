# ── TrackFlow – Docker Compose ─────────────────────────────────────────
# Orchestrates all services for local development.
#
# Usage:
#   docker compose build    # Build all images
#   docker compose up       # Start all services
#   docker compose up -d    # Start in detached mode (background)
#   docker compose down     # Stop and remove containers
#   docker compose logs -f  # Follow logs from all services

# ── Shared environment variables ───────────────────────────────────────
x-common-env: &common-env
  REDIS_URL: "redis://redis:6379/0"
  QDRANT_URL: "http://qdrant:6333"

services:

  # ── Backend API (FastAPI + Flask) ─────────────────────────────────────
  api:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: trackflow-api
    command: uvicorn src.fastapi_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *common-env
      TRACKFLOW_API_BASE_URL: "http://127.0.0.1:8000"
      MCP_SERVER_URL: "http://mcp:8001/mcp"
      MCP_OAUTH_TOKEN_URL: "${MCP_OAUTH_TOKEN_URL:-http://keycloak:8080/realms/trackflow/protocol/openid-connect/token}"
      MCP_OAUTH_CLIENT_ID: "${MCP_OAUTH_CLIENT_ID:-trackflow-agent}"
      MCP_OAUTH_CLIENT_SECRET: "${MCP_OAUTH_CLIENT_SECRET:-}"
      MCP_OAUTH_SCOPES: "${MCP_OAUTH_SCOPES:-trackflow:mcp incidents:read inventory:read}"
    depends_on:
      mcp:
        condition: service_healthy
    volumes:
      # Bind-mount source code for hot-reload (--reload in uvicorn)
      - ./services/api:/app
      - ./services/telemetry:/app/telemetry
      - ./services/reporting:/app/reporting
      - ./data/pipelines:/app/data/pipelines
      # Anonymous volume: prevents local node_modules (if any) from
      # shadowing the container-installed Python packages
      - /app/__pycache__/
    networks:
      - trackflow-net

  # ── OAuth-protected MCP company tools ─────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: mcps/Dockerfile
    container_name: trackflow-mcp
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8001"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-http://localhost:8001}"
      MCP_AUDIENCE: "trackflow-mcp"
      OAUTH_ISSUER_URL: "${OAUTH_ISSUER_URL:-http://localhost:8080/realms/trackflow}"
      OAUTH_JWKS_URI: "${OAUTH_JWKS_URI:-http://keycloak:8080/realms/trackflow/protocol/openid-connect/certs}"
      TRACKFLOW_API_BASE_URL: "http://api:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/.well-known/oauth-protected-resource', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - trackflow-net

  # ── Local OAuth 2.1 / OIDC issuer for MCP development ────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: trackflow-keycloak
    command: start-dev --import-realm --http-enabled=true
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in the root .env}"
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}"
      KC_HOSTNAME_STRICT: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8080"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./mcps/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    networks:
      - trackflow-net

  # ── Frontend UIS (Website + Backoffice) ──────────────────────────────
  uis:
    build:
      context: ./uis
      dockerfile: Dockerfile
    container_name: trackflow-uis
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      <<: *common-env
    depends_on:
      - api
    volumes:
      # Bind-mount source code for Next.js hot-reload (HMR)
      - ./uis/website:/app/website
      - ./uis/backoffice:/app/backoffice
      # Shared src/ folder for cross-project imports (types, utils, etc.)
      - ./src:/app/src
      # Anonymous volumes: prevent local node_modules from shadowing
      # the container-installed ones. Essential for Linux compatibility.
      - /app/website/node_modules
      - /app/backoffice/node_modules
      - /app/website/.next
      - /app/backoffice/.next
    networks:
      - trackflow-net

  # ── Redis (message broker) ──────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: trackflow-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory-policy noeviction
    environment:
      <<: *common-env
    networks:
      - trackflow-net

  # ── Celery Worker (async task processor) ─────────────────────────────
  celery-worker:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: trackflow-worker
    command: celery -A src.celery_app worker -l info --concurrency=2
    env_file:
      - .env
    environment:
      <<: *common-env
    depends_on:
      - redis
    volumes:
      - ./services/api:/app
      - ./services/telemetry:/app/telemetry
      - ./services/reporting:/app/reporting
      - /app/__pycache__/
    networks:
      - trackflow-net

  # ── Flower (Celery observability dashboard) ──────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: trackflow-flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    environment:
      <<: *common-env
    depends_on:
      - redis
    networks:
      - trackflow-net

  # ── Qdrant (Vector database for RAG) ────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: trackflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      <<: *common-env
    networks:
      - trackflow-net

networks:
  trackflow-net:
    driver: bridge

volumes:
  keycloak_data:
    name: trackflow_keycloak_data
  qdrant_data: