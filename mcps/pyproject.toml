[project]
name = "trackflow-mcps"
version = "0.1.0"
description = "OAuth-protected MCP server for TrackFlow company tools"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx>=0.28.1",
    "mcpauth>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/trackflow_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
