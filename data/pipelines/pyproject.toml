[project]
name = "pipelines"
version = "0.1.0"
description = "TrackFlow data pipeline"
readme = "README.md"
authors = [
    { name = "Leonardo Cusatis", email = "leonardocusatis45@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prefect>=3",
]

[project.scripts]
pipelines = "pipelines:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
