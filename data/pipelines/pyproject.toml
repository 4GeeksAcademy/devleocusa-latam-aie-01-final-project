[project]
name = "pipelines"
version = "0.1.0"
description = "TrackFlow data pipeline"
readme = "README.md"
authors = [
    { name = "Leonardo Cusatis", email = "leonardocusatis45@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.15",
    "markitdown[pdf]>=0.1.8",
    "openai>=3.19.2",
    "prefect>=3",
    "py-readability-metrics>=1.4.5",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
]

[project.scripts]
pipelines = "pipelines:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
