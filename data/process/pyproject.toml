[project]
name = "process"
version = "0.1.0"
description = "TrackFlow data processing – chunking, embedding, indexing for RAG"
readme = "README.md"
authors = [
    { name = "Leonardo Cusatis", email = "leonardocusatis45@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.12.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
process = "process:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
